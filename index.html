<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- ▼▼ 공유(카톡) 미리보기 — 주소·이미지만 나중에 바꿔주세요 ▼▼ -->
<title>결혼합니다 · 엄지 ♡ 이도연</title>
<meta name="description" content="저희 두 사람의 결혼식에 초대합니다.">
<meta property="og:type" content="website">
<meta property="og:title" content="결혼합니다 · 엄지 ♡ 이도연">
<meta property="og:description" content="저희 두 사람의 결혼식에 초대합니다.">
<meta property="og:image" content="images/og-image.jpg">
<meta property="og:locale" content="ko_KR">
<meta name="theme-color" content="#F2F5EE">
<!-- ▲▲ 여기까지 ▲▲ -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">

<style>
:root{
  --paper:      #F2F5EE;
  --paper-warm: #FAFBF7;
  --ink:        #16241D;   /* 본문 — 종이 대비 14.4:1 */
  --ink-soft:   #42574B;   /* 보조 — 종이 대비 7.4:1  */
  --pine:       #1E4033;
  --jade:       #2F6350;   /* 강조 — 종이 대비 6.6:1  */
  --sage:       #7FA189;
  --seal:       #8E332C;
  --line:       rgba(22,36,29,.22);
  --line-strong:rgba(22,36,29,.38);
  --focus:      #B4531F;   /* 초록 위에서도 분간되는 주황 계열 */
  --shadow:     0 18px 50px -30px rgba(22,36,29,.55);

  --serif: "Gowun Batang", "Nanum Myeongjo", serif;
  --sans:  "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --latin: "Cormorant Garamond", serif;

  --col: 480px;
  --gutter: 26px;
}

/* 글씨 크기: 브라우저 기본 설정을 그대로 따릅니다 */
html{ font-size:100%; scroll-behavior:smooth; -webkit-text-size-adjust:100% }
html.text-lg{ font-size:125% }
html.text-xl{ font-size:150% }

*{ box-sizing:border-box }
body{
  margin:0;
  background:var(--pine);
  color:var(--ink);
  font-family:var(--sans);
  font-size:1rem;
  line-height:1.9;
  word-break:keep-all;
}
img{ max-width:100%; display:block }
a{ color:inherit }
button{ font-family:inherit; font-size:inherit }

/* 키보드 초점: 어떤 배경에서도 보이도록 이중 테두리 */
:focus-visible{
  outline:3px solid var(--focus);
  outline-offset:2px;
  border-radius:3px;
  box-shadow:0 0 0 6px rgba(255,255,255,.85);
}

/* 화면낭독기 전용 텍스트 */
.sr-only{
  position:absolute; width:1px; height:1px;
  padding:0; margin:-1px; overflow:hidden;
  clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap;
}
.skip{
  position:absolute; left:8px; top:-60px; z-index:100;
  background:var(--pine); color:#fff; padding:12px 20px;
  border-radius:0 0 4px 4px; text-decoration:none; font-weight:600;
}
.skip:focus{ top:0 }

.paper{
  max-width:var(--col); margin:0 auto;
  background:var(--paper); min-height:100vh;
  position:relative; overflow:hidden;
  box-shadow:0 0 80px rgba(0,0,0,.35);
}

/* ── 상단 도구 막대 (언어 · 글씨 크기) ── */
.toolbar{
  position:fixed; top:12px; right:12px; z-index:60;
  display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end;
  max-width:calc(100vw - 24px);
}
@media (min-width:530px){
  .toolbar{ right:calc(50% - var(--col)/2 + 12px) }
}
.pillset{
  display:flex; gap:2px; padding:3px;
  background:rgba(250,251,247,.94);
  backdrop-filter:blur(10px);
  border:1px solid var(--line-strong);
  border-radius:999px;
}
.pillset button{
  border:0; background:transparent; cursor:pointer;
  padding:7px 14px; border-radius:999px;
  font-size:.8rem; font-weight:600; letter-spacing:.02em;
  color:var(--ink-soft); min-height:34px;
}
.pillset button[aria-pressed="true"]{ background:var(--pine); color:#fff }

/* ── 공통 섹션 ── */
.sec{ padding:60px var(--gutter) }
.sec + .sec{ border-top:1px solid var(--line) }
.sec-head{ text-align:center; margin-bottom:32px }
.sec-head h2{
  font-family:var(--serif); font-weight:400;
  font-size:1.4rem; line-height:1.4; letter-spacing:.02em; margin:0;
}
.sec-head .en{
  margin:8px 0 0; font-size:.85rem; color:var(--ink-soft);
  font-family:var(--latin); font-style:italic; letter-spacing:.1em;
}

/* ── 표지 ── */
.cover{ padding:76px var(--gutter) 58px; text-align:center }
.arch{
  width:min(262px, 70%); margin:0 auto 32px;
  aspect-ratio:3/4;
  border-radius:999px 999px 10px 10px;
  overflow:hidden;
  background:linear-gradient(160deg,#D5E2D6,#B7CCBB);
  box-shadow:var(--shadow);
  position:relative;
}
.arch img{ width:100%; height:100%; object-fit:cover }
.photo.empty img{ display:none }
.photo.empty::after{
  content:attr(data-label);
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  padding:16px; text-align:center;
  font-size:.8rem; line-height:1.6; color:var(--pine);
}
.cover-names{
  font-family:var(--serif);
  font-size:clamp(1.8rem, 8vw, 2.3rem);
  line-height:1.35; margin:0;
  display:flex; align-items:center; justify-content:center;
  gap:14px; flex-wrap:wrap;
}
.cover-names .amp{ color:var(--seal); font-size:.6em; transform:translateY(-2px) }
.cover-when{
  margin:24px auto 0; max-width:320px;
  padding-top:20px; border-top:1px solid var(--line);
  font-size:1rem; line-height:1.95;
}
.cover-when strong{ font-weight:600; display:block }
.cover-when span{ color:var(--ink-soft); font-size:.94rem }

/* ── 인사말 ── */
.greeting{ text-align:center }
.greeting p{ margin:0 0 16px; font-size:1rem; line-height:2.05 }
.greeting p:last-child{ margin-bottom:0 }

/* ── 가족 ── */
.family{ display:grid; gap:14px }
.fam{
  background:var(--paper-warm);
  border:1px solid var(--line);
  border-radius:3px 3px 3px 16px;
  padding:20px 22px;
}
.fam-role{
  font-family:var(--latin); font-style:italic;
  font-size:.85rem; color:var(--jade); letter-spacing:.09em; margin-bottom:4px;
}
.fam-name{ font-family:var(--serif); font-size:1.25rem; line-height:1.3; margin:0; font-weight:400 }
.fam-parents{ margin-top:10px; font-size:.94rem; color:var(--ink-soft); line-height:1.9 }

/* ── 갤러리 ── */
.gallery{
  display:flex; gap:10px; overflow-x:auto;
  padding:4px var(--gutter) 8px;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:thin;
}
.gallery .photo{
  flex:0 0 68%; aspect-ratio:4/5;
  scroll-snap-align:center;
  border:0; padding:0; margin:0;
  border-radius:2px; overflow:hidden;
  background:linear-gradient(160deg,#D5E2D6,#B7CCBB);
  position:relative; cursor:zoom-in;
}
.gallery .photo img{ width:100%; height:100%; object-fit:cover }
.gallery .photo.empty{ cursor:default }
.gallery-hint{
  text-align:center; font-size:.85rem; color:var(--ink-soft);
  margin:14px var(--gutter) 0; line-height:1.7;
}

/* ── 순서 (1·2·3부) ── */
.part{
  display:grid; grid-template-columns:46px 1fr; gap:16px;
  padding-bottom:30px; position:relative;
}
.part:not(:last-child)::before{
  content:""; position:absolute; left:22px; top:46px; bottom:0;
  width:1px; background:var(--line);
}
.seal{
  width:46px; height:46px; border-radius:2px;
  background:var(--seal); color:#fff;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--serif); font-size:1.2rem;
}
.part-title{ font-family:var(--serif); font-size:1.15rem; margin:8px 0 0; font-weight:400 }
.part-meta{ font-size:.94rem; color:var(--jade); margin-top:4px }
.part-notes{ margin:12px 0 0; padding:0; list-style:none }
.part-notes li{
  position:relative; padding-left:15px;
  font-size:.96rem; color:var(--ink-soft); line-height:1.85; margin-bottom:6px;
}
.part-notes li::before{
  content:""; position:absolute; left:0; top:.72em;
  width:5px; height:5px; border-radius:50%; background:var(--jade);
}

/* ── 피로연: 비건 메뉴 · 축가 ── */
.menu-box{
  margin-top:15px; padding:16px 18px;
  background:var(--paper-warm);
  border:1px solid var(--line);
  border-left:4px solid var(--jade);
  border-radius:2px;
}
.menu-box h4{ margin:0 0 8px; font-family:var(--serif); font-weight:400; font-size:1rem }
.menu-box ul{ margin:0; padding-left:18px; font-size:.94rem; color:var(--ink-soft); line-height:1.9 }
.menu-box p{ margin:10px 0 0; font-size:.88rem; color:var(--ink-soft) }

.song-toggle{
  margin-top:15px; width:100%;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:14px 16px; cursor:pointer; min-height:48px;
  background:var(--paper-warm); color:var(--pine);
  border:1px solid var(--line-strong); border-radius:2px;
  font-size:.96rem; font-weight:600; text-align:left;
}
.song-toggle .chev{ font-size:.75rem; color:var(--jade) }
.song-panel{
  display:none; margin-top:-1px;
  padding:20px 18px; border:1px solid var(--line-strong);
  background:var(--paper-warm); border-radius:0 0 2px 2px;
}
.song-panel.open{ display:block }
.song-panel h4{ margin:0 0 12px; font-family:var(--serif); font-weight:400; font-size:1.05rem }
.song-panel .lines{
  margin:0; font-size:.96rem; line-height:2.15; color:var(--ink);
  white-space:pre-wrap;
}
.song-panel .cite{ margin:14px 0 0; font-size:.85rem; line-height:1.8; color:var(--ink-soft) }
.song-panel .cite + .cite{ margin-top:8px }

/* ── 안내 사항 ── */
.notices{ display:grid; gap:13px }
.notice{
  background:var(--paper-warm);
  border:1px solid var(--line);
  border-radius:3px 16px 3px 3px;
  padding:19px 20px;
}
.notice h3{ margin:0; font-family:var(--serif); font-weight:400; font-size:1.1rem }
.notice p{ margin:7px 0 0; font-size:.96rem; color:var(--ink-soft); line-height:1.85 }
.notice-link{
  display:inline-block; margin-top:12px; min-height:44px;
  font-size:.9rem; font-weight:600; color:#fff; background:var(--jade);
  text-decoration:underline; text-underline-offset:3px;
  padding:11px 18px; border-radius:2px;
}

/* ── 오시는 길 ── */
.map{
  aspect-ratio:4/3; border-radius:2px; overflow:hidden;
  border:1px solid var(--line); background:#E4EBE3; margin-bottom:20px;
}
.map iframe{ width:100%; height:100%; border:0; display:block }
.venue{ text-align:center; margin-bottom:20px }
.venue-name{ font-family:var(--serif); font-size:1.2rem }
.venue-addr{ font-size:.96rem; color:var(--ink-soft); margin-top:5px }
.map-links{ display:flex; gap:8px; margin-bottom:26px; flex-wrap:wrap }
.map-links a{
  flex:1 1 30%; text-align:center; min-height:46px;
  display:flex; align-items:center; justify-content:center;
  text-decoration:underline; text-underline-offset:3px;
  padding:11px 6px; font-size:.9rem; font-weight:600;
  border:1px solid var(--line-strong); border-radius:2px;
  background:var(--paper-warm); color:var(--pine);
}
.transit{ display:grid; gap:15px }
.transit-row{ display:grid; grid-template-columns:64px 1fr; gap:12px; font-size:.96rem }
.transit-label{ color:var(--jade); font-weight:600 }
.transit-desc{ color:var(--ink-soft); line-height:1.8 }

/* ── 참석 의사 ── */
.rsvp{ text-align:center; background:var(--paper-warm) }
.rsvp .lead{ font-size:1rem; margin:0 0 24px; color:var(--ink-soft) }
.btn{
  display:inline-block; text-decoration:none;
  padding:16px 40px; border-radius:2px; min-height:48px;
  background:var(--pine); color:#fff;
  font-size:1rem; font-weight:600; border:0; cursor:pointer;
}
.rsvp .note{ display:block; margin-top:14px; font-size:.85rem; color:var(--ink-soft) }

/* ── 계좌 ── */
.acct-group + .acct-group{ margin-top:26px }
.acct-group h3{
  font-family:var(--serif); font-weight:400; font-size:1.05rem;
  margin:0 0 12px; padding-bottom:9px; border-bottom:1px solid var(--line);
}
.acct{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0 }
.acct-who{ font-size:.88rem; color:var(--ink-soft) }
.acct-num{ font-size:1rem; margin-top:2px }
.copy{
  flex:0 0 auto; min-height:44px;
  border:1px solid var(--line-strong); background:var(--paper-warm);
  color:var(--pine); font-size:.88rem; font-weight:600;
  padding:9px 16px; border-radius:2px; cursor:pointer;
}
.copy.done{ background:var(--pine); color:#fff; border-color:var(--pine) }

/* ── 고마운 분들 ── */
.credits .lead{ font-size:.96rem; color:var(--ink-soft); margin:0 0 26px; text-align:center }
.credit-group + .credit-group{ margin-top:28px }
.credit-group h3{
  font-family:var(--serif); font-weight:400; font-size:1.05rem;
  margin:0 0 12px; padding-bottom:9px; border-bottom:1px solid var(--line);
}
.credit-list{ list-style:none; margin:0; padding:0; display:grid; gap:16px }
.credit-name{ font-size:1rem }
.credit-list a.credit-name{
  display:inline-flex; align-items:center; min-height:44px;
  color:var(--pine); font-weight:600;
  text-decoration:underline; text-underline-offset:3px;
}
.credit-role{ font-size:.92rem; color:var(--ink-soft); line-height:1.8; margin-top:2px }

/* ── 공유 · 맺음 ── */
.share{ text-align:center }
.share .license{
  font-size:.88rem; line-height:1.9; color:var(--ink-soft);
  margin:24px auto 0; max-width:34em; text-align:left;
}
.share .license a{
  display:inline-flex; align-items:center; min-height:44px;
  color:var(--pine); font-weight:600;
  text-decoration:underline; text-underline-offset:3px;
}
.share .license + .license{ margin-top:14px }
.outro{ text-align:center; padding:58px var(--gutter) 72px; background:var(--pine); color:#F0F5EE }
.outro .hui{ font-family:var(--serif); font-size:1.7rem; color:#C9DCCC }
.outro-names{ font-family:var(--serif); font-size:1.1rem; margin:18px 0 6px }
.outro-date{ font-family:var(--latin); font-size:.9rem; letter-spacing:.16em; color:#D3E1D2 }
.outro-thanks{ font-size:.94rem; margin-top:22px; color:#E3EDE1 }

/* ── 사진 크게 보기 ── */
.lightbox{
  position:fixed; inset:0; z-index:80;
  background:rgba(14,24,19,.96);
  display:none; align-items:center; justify-content:center; padding:24px;
}
.lightbox.on{ display:flex }
.lightbox img{ max-width:100%; max-height:84vh; object-fit:contain }
.lightbox .close{
  position:absolute; top:14px; right:14px;
  min-width:48px; min-height:48px; border-radius:50%;
  border:1px solid rgba(255,255,255,.4); background:rgba(255,255,255,.14);
  color:#fff; font-size:1.3rem; cursor:pointer;
}
.lightbox .caption{
  position:absolute; left:0; right:0; bottom:18px;
  text-align:center; color:#E3EDE1; font-size:.9rem; padding:0 24px;
}

/* 고대비 모드 */
@media (prefers-contrast:more){
  :root{
    --ink:#000; --ink-soft:#1E2E25;
    --line:rgba(0,0,0,.5); --line-strong:rgba(0,0,0,.7);
    --jade:#1E4A3A; --paper:#FFFFFF; --paper-warm:#FFFFFF;
  }
  .notice-link, .map-links a, .btn, .copy{ border-width:2px }
}

/* 동작 최소화 */
@media (prefers-reduced-motion:reduce){
  html{ scroll-behavior:auto }
  *{ transition:none !important; animation:none !important }
}

/* 인쇄 */
@media print{
  body{ background:#fff }
  .toolbar, .skip, .lightbox, .song-toggle{ display:none !important }
  .song-panel{ display:block !important }
  .paper{ box-shadow:none; max-width:none }
}
</style>
</head>

<body>
<a class="skip" href="#main" id="skipLink">본문으로 건너뛰기</a>

<div class="toolbar">
  <div class="pillset" role="group" id="langGroup">
    <button type="button" data-lang="ko" aria-pressed="true">한국어</button>
    <button type="button" data-lang="en" lang="en" aria-pressed="false">English</button>
  </div>
  <div class="pillset" role="group" id="sizeGroup">
    <button type="button" data-size="base" aria-pressed="true">가</button>
    <button type="button" data-size="text-lg" aria-pressed="false" style="font-size:1rem">가</button>
    <button type="button" data-size="text-xl" aria-pressed="false" style="font-size:1.2rem">가</button>
  </div>
</div>

<p class="sr-only" role="status" aria-live="polite" id="live"></p>

<main class="paper" id="main">

  <header class="cover">
    <div class="arch photo" id="coverPhoto"></div>
    <h1 class="cover-names" id="coverNames"></h1>
    <div class="cover-when" id="coverWhen"></div>
  </header>

  <section class="sec greeting" aria-labelledby="h-greeting">
    <div class="sec-head"><h2 id="h-greeting" data-k="greetingTitle"></h2><p class="en" lang="en" aria-hidden="true">Invitation</p></div>
    <div id="greetingBody"></div>
  </section>

  <section class="sec" aria-labelledby="h-family">
    <div class="sec-head"><h2 id="h-family" data-k="familyTitle"></h2><p class="en" lang="en" aria-hidden="true">Family</p></div>
    <div class="family" id="familyBody"></div>
  </section>

  <section class="sec" style="padding-left:0;padding-right:0" aria-labelledby="h-gallery">
    <div class="sec-head" style="padding:0 var(--gutter)">
      <h2 id="h-gallery" data-k="galleryTitle"></h2><p class="en" lang="en" aria-hidden="true">Our days</p>
    </div>
    <div class="gallery" id="galleryBody" tabindex="0" role="group"></div>
    <p class="gallery-hint" data-k="galleryHint"></p>
  </section>

  <section class="sec" aria-labelledby="h-program">
    <div class="sec-head"><h2 id="h-program" data-k="programTitle"></h2><p class="en" lang="en" aria-hidden="true">Programme</p></div>
    <div id="programBody"></div>
  </section>

  <section class="sec" aria-labelledby="h-notice">
    <div class="sec-head"><h2 id="h-notice" data-k="noticeTitle"></h2><p class="en" lang="en" aria-hidden="true">Good to know</p></div>
    <div class="notices" id="noticeBody"></div>
  </section>

  <section class="sec" aria-labelledby="h-location">
    <div class="sec-head"><h2 id="h-location" data-k="locationTitle"></h2><p class="en" lang="en" aria-hidden="true">Location</p></div>
    <div class="map" id="mapBox"></div>
    <div class="venue" id="venueBox"></div>
    <div class="map-links" id="mapLinks"></div>
    <div class="transit" id="transitBody"></div>
  </section>

  <section class="sec rsvp" aria-labelledby="h-rsvp">
    <div class="sec-head"><h2 id="h-rsvp" data-k="rsvpTitle"></h2><p class="en" lang="en" aria-hidden="true">RSVP</p></div>
    <p class="lead" data-k="rsvpDesc"></p>
    <a class="btn" id="rsvpBtn" href="#" target="_blank" rel="noopener"></a>
    <span class="note" data-k="rsvpNote"></span>
  </section>

  <section class="sec" aria-labelledby="h-gift">
    <div class="sec-head"><h2 id="h-gift" data-k="giftTitle"></h2><p class="en" lang="en" aria-hidden="true">With thanks</p></div>
    <div id="giftBody"></div>
  </section>

  <section class="sec credits" id="creditsSection" aria-labelledby="h-credits">
    <div class="sec-head"><h2 id="h-credits" data-k="creditsTitle"></h2><p class="en" lang="en" aria-hidden="true">Thanks to</p></div>
    <p class="lead" data-k="creditsDesc"></p>
    <div id="creditsBody"></div>
  </section>

  <section class="sec share" aria-labelledby="h-share">

    thanks:       {ko:"와 주셔서 감사합니다.",en:"Thank you for being with us."},
    fatherOf:     {ko:"의 아버지",en:"'s father"},
    motherOf:     {ko:"의 어머니",en:"'s mother"},
    langGroup:    {ko:"언어 선택",en:"Choose a language"},
    sizeGroup:    {ko:"글씨 크기",en:"Text size"},
    sizeBase:     {ko:"기본 크기",en:"Default size"},
    sizeLg:       {ko:"크게",en:"Large"},
    sizeXl:       {ko:"아주 크게",en:"Extra large"},
    sizeMsg:      {ko:"글씨 크기를 바꿨습니다.",en:"Text size changed."},
    galleryRegion:{ko:"사진 모음, 좌우로 넘길 수 있습니다",en:"Photo gallery, scrolls horizontally"},
    enlarge:      {ko:"크게 보기",en:"Enlarge"},
    skip:         {ko:"본문으로 건너뛰기",en:"Skip to content"},
    mapTitle:     {ko:"예식장 위치 지도",en:"Map of the venue"},
    andName:      {ko:"그리고",en:"and"},
    kakao:"카카오맵", naver:"네이버지도", google:"Google Maps"
  }
};
/* ══════════════ 여기까지만 고치시면 됩니다 ══════════════ */


/* ─────────────── 아래는 건드리지 않으셔도 됩니다 ─────────────── */
let lang = "ko";
const t = v => (v && typeof v === "object" && !Array.isArray(v)) ? (v[lang] ?? v.ko) : v;
const L = k => t(CONFIG.labels[k]);
const $ = s => document.querySelector(s);
const say = msg => { const l = $("#live"); l.textContent = ""; setTimeout(() => l.textContent = msg, 60); };

/* 사진 한 칸 만들기 (없으면 안내 문구 표시) */
function photo(item, tag){
  const el = document.createElement(tag);
  el.className = "photo";
  const alt = t(item.alt) || "";
  el.dataset.label = lang === "ko" ? `${item.src} 파일을 넣어주세요` : `Add ${item.src}`;
  const img = new Image();
  img.alt = alt;
  img.src = item.src;
  img.addEventListener("error", () => {
    el.classList.add("empty");
    if (tag === "button"){ el.disabled = true; el.setAttribute("aria-label", el.dataset.label); }
  });
  el.appendChild(img);
  return el;
}

function render(){
  document.documentElement.lang = lang;
  $("#skipLink").textContent = L("skip");
  $("#langGroup").setAttribute("aria-label", L("langGroup"));
  $("#sizeGroup").setAttribute("aria-label", L("sizeGroup"));
  ["sizeBase","sizeLg","sizeXl"].forEach((k,i) =>
    $("#sizeGroup").children[i].setAttribute("aria-label", L(k)));

  document.querySelectorAll("[data-k]").forEach(el => el.textContent = L(el.dataset.k));

  /* 표지 */
  const oldCover = $("#coverPhoto");
  const cover = photo(CONFIG.coverPhoto, "div");
  cover.id = "coverPhoto";
  cover.classList.add("arch");
  oldCover.replaceWith(cover);

  $("#coverNames").innerHTML =
    `<span>${t(CONFIG.groom.name)}</span>` +
    `<span class="amp" aria-hidden="true">♡</span><span class="sr-only"> ${L("andName")} </span>` +
    `<span>${t(CONFIG.bride.name)}</span>`;
  $("#coverWhen").innerHTML =
    `<strong>${t(CONFIG.dateText)} ${t(CONFIG.timeText)}</strong><span>${t(CONFIG.venueName)}</span>`;

  /* 인사말 */
  $("#greetingBody").innerHTML = CONFIG.greeting.map(p => `<p>${t(p)}</p>`).join("");

  /* 가족 */
  $("#familyBody").innerHTML = [CONFIG.groom, CONFIG.bride].map(p => {
    const parents = [["fatherOf", p.father], ["motherOf", p.mother]]
      .filter(([, who]) => t(who))
      .map(([key, who]) => `${t(p.name)}${L(key)} ${t(who)}`)
      .join("<br>");
    return `
    <div class="fam">
      <div class="fam-role">${t(p.role)}</div>
      <h3 class="fam-name">${t(p.name)}</h3>
      <div class="fam-parents">${parents}</div>
    </div>`;
  }).join("");

  /* 갤러리 — 키보드로도 넘기고 열 수 있게 button 으로 만듭니다 */
  const g = $("#galleryBody");
  g.setAttribute("aria-label", L("galleryRegion"));
  g.innerHTML = "";
  CONFIG.gallery.forEach(item => {
    const el = photo(item, "button");
    el.type = "button";
    el.setAttribute("aria-label", `${t(item.alt)} — ${L("enlarge")}`);
    el.addEventListener("click", () => openLightbox(item, el));
    g.appendChild(el);
  });

  /* 예식 순서 */
  $("#programBody").innerHTML = CONFIG.program.map((p, i) => {
    const menu = p.menu ? `
      <div class="menu-box">
        <h4>${t(p.menu.title)}</h4>
        <ul>${p.menu.items.map(m => `<li>${t(m)}</li>`).join("")}</ul>
        ${p.menu.foot ? `<p>${t(p.menu.foot)}</p>` : ""}
      </div>` : "";
    const song = p.song ? `
      <button class="song-toggle" type="button" data-song="${i}" aria-expanded="false" aria-controls="song-${i}">
        <span>${t(p.song.button)}</span><span class="chev" aria-hidden="true">▾</span>
      </button>
      <div class="song-panel" id="song-${i}">
        <h4>${t(p.song.title)}</h4>
        <p class="lines">${t(p.song.lines)}</p>
        ${p.song.credit ? `<p class="cite">${t(p.song.credit)}</p>` : ""}
        ${p.song.note ? `<p class="cite">${t(p.song.note)}</p>` : ""}
      </div>` : "";
    return `
      <div class="part">
        <div class="seal" aria-hidden="true">${p.mark}</div>
        <div>
          <h3 class="part-title">${t(p.title)}</h3>
          <p class="part-meta">${t(p.meta)}</p>
          <ul class="part-notes">${p.notes.map(n => `<li>${t(n)}</li>`).join("")}</ul>
          ${menu}${song}
        </div>
      </div>`;
  }).join("");

  /* 안내 사항 */
  $("#noticeBody").innerHTML = CONFIG.notices.map(n => `
    <div class="notice">
      <h3>${t(n.title)}</h3>
      <p>${t(n.desc)}</p>
      ${n.link ? `<a class="notice-link" href="${n.link}" target="_blank" rel="noopener">${t(n.linkText)}</a>` : ""}
    </div>`).join("");

  /* 오시는 길 */
  const mapBox = $("#mapBox");
  if (CONFIG.mapEmbed){
    mapBox.style.display = "";
    mapBox.innerHTML = `<iframe src="${CONFIG.mapEmbed}" loading="lazy" allowfullscreen referrerpolicy="no-referrer-when-downgrade" title="${L("mapTitle")}"></iframe>`;
  } else {
    mapBox.style.display = "none";
  }
  $("#venueBox").innerHTML =
    `<div class="venue-name">${t(CONFIG.venueName)}</div><div class="venue-addr">${t(CONFIG.venueAddr)}</div>`;

  const q  = encodeURIComponent(t(CONFIG.venueName));
  const ll = (CONFIG.mapLat && CONFIG.mapLng) ? `${CONFIG.mapLat},${CONFIG.mapLng}` : "";
  $("#mapLinks").innerHTML = `
    <a href="https://map.kakao.com/link/search/${q}" target="_blank" rel="noopener">${L("kakao")}</a>
    <a href="https://map.naver.com/v5/search/${q}" target="_blank" rel="noopener">${L("naver")}</a>
    <a href="https://www.google.com/maps/dir/?api=1&destination=${ll || q}" target="_blank" rel="noopener">${L("google")}</a>`;

  $("#transitBody").innerHTML = CONFIG.transit.map(r => `
    <div class="transit-row">
      <div class="transit-label">${t(r.label)}</div>
      <div class="transit-desc">${t(r.desc)}</div>
    </div>`).join("");

  /* 참석 의사 */
  const btn = $("#rsvpBtn");
  btn.textContent = L("rsvpBtn");
  btn.href = CONFIG.rsvpUrl;

  /* 계좌 */
  const group = (key, list) => `
    <div class="acct-group">
      <h3>${L(key)}</h3>
      ${list.map(a => `
        <div class="acct">
          <div>
            <div class="acct-who">${t(a.who)}</div>
            <div class="acct-num">${a.bank} ${a.number}</div>
          </div>
          <button class="copy" type="button" data-copy="${a.bank} ${a.number}"
                  aria-label="${t(a.who)} ${L("copyAria")}">${L("copy")}</button>
        </div>`).join("")}
    </div>`;
  $("#giftBody").innerHTML =
    group("groomSide", CONFIG.accounts.groomSide) + group("brideSide", CONFIG.accounts.brideSide);

  /* 고마운 분들 */
  const credits = CONFIG.credits || [];
  $("#creditsSection").style.display = credits.length ? "" : "none";
  $("#creditsBody").innerHTML = credits.map(g => `
    <div class="credit-group">
      <h3>${t(g.title)}</h3>
      <ul class="credit-list">
        ${g.items.map(i => `
          <li>
            ${i.url
              ? `<a class="credit-name" href="${i.url}" target="_blank" rel="noopener">${t(i.name)}<span class="sr-only"> — ${L("newWindow")}</span></a>`
              : `<div class="credit-name">${t(i.name)}</div>`}
            ${i.role ? `<div class="credit-role">${t(i.role)}</div>` : ""}
          </li>`).join("")}
      </ul>
    </div>`).join("");

  /* 공유 · 맺음 */
  $("#shareBtn").textContent = L("shareBtn");
  const note = $("#licenseNote");
  if (CONFIG.repoUrl){
    note.style.display = "";
    note.innerHTML = `${L("licenseDesc")} <a href="${CONFIG.repoUrl}" target="_blank" rel="noopener">${L("repoLink")}<span class="sr-only"> — ${L("newWindow")}</span></a>`;
  } else {
    note.style.display = "none";
  }
  $("#outroNames").textContent = `${t(CONFIG.groom.name)} · ${t(CONFIG.bride.name)}`;
  $("#outroDate").textContent = CONFIG.outroDate;
}

/* ── 언어 전환 ── */
$("#langGroup").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  lang = b.dataset.lang;
  [...$("#langGroup").children].forEach(x => x.setAttribute("aria-pressed", String(x.dataset.lang === lang)));
  try{ localStorage.setItem("inv-lang", lang); }catch{}
  render();
});

/* ── 글씨 크기 ── */
function applySize(size){
  document.documentElement.classList.remove("text-lg","text-xl");
  if (size !== "base") document.documentElement.classList.add(size);
  [...$("#sizeGroup").children].forEach(x => x.setAttribute("aria-pressed", String(x.dataset.size === size)));
  try{ localStorage.setItem("inv-size", size); }catch{}
}
$("#sizeGroup").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  applySize(b.dataset.size);
  say(L("sizeMsg"));
});

/* ── 축가 가사 펼치기 ── */
document.addEventListener("click", e => {
  const b = e.target.closest(".song-toggle"); if (!b) return;
  const panel = document.getElementById("song-" + b.dataset.song);
  const open = panel.classList.toggle("open");
  b.setAttribute("aria-expanded", String(open));
  b.querySelector(".chev").textContent = open ? "▴" : "▾";
});

/* ── 계좌 복사 ── */
document.addEventListener("click", async e => {
  const b = e.target.closest(".copy"); if (!b) return;
  try{
    await navigator.clipboard.writeText(b.dataset.copy);
    b.textContent = L("copied"); b.classList.add("done");
    say(L("copiedMsg"));
    setTimeout(() => { b.textContent = L("copy"); b.classList.remove("done"); }, 1800);
  }catch{ window.prompt(L("copyAria"), b.dataset.copy); }
});

/* ── 공유 ── */
$("#shareBtn").addEventListener("click", async () => {
  const data = { title: document.title, url: location.href };
  if (navigator.share){ try{ await navigator.share(data); return; }catch{} }
  try{ await navigator.clipboard.writeText(location.href); say(L("sharedMsg")); }
  catch{ window.prompt("URL", location.href); }
});

/* ── 사진 크게 보기 (초점 가두기 · 되돌리기) ── */
let lastFocus = null;
function openLightbox(item, trigger){
  lastFocus = trigger;
  $("#lightboxImg").src = item.src;
  $("#lightboxImg").alt = t(item.alt) || "";
  $("#lightboxCaption").textContent = t(item.alt) || "";
  $("#lightbox").classList.add("on");
  $("#lightboxClose").focus();
}
function closeLightbox(){
  $("#lightbox").classList.remove("on");
  if (lastFocus) lastFocus.focus();
}
$("#lightboxClose").addEventListener("click", closeLightbox);
$("#lightbox").addEventListener("click", e => { if (e.target.id === "lightbox") closeLightbox(); });
document.addEventListener("keydown", e => {
  if (!$("#lightbox").classList.contains("on")) return;
  if (e.key === "Escape") closeLightbox();
  if (e.key === "Tab"){ e.preventDefault(); $("#lightboxClose").focus(); }
});

/* ── 갤러리: 방향키로 넘기기 ── */
$("#galleryBody").addEventListener("keydown", e => {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  e.preventDefault();
  const step = e.currentTarget.clientWidth * 0.7;
  e.currentTarget.scrollBy({ left: e.key === "ArrowRight" ? step : -step, behavior: "smooth" });
});

/* ── 지난번 설정 불러오기 ── */
try{
  const s = localStorage.getItem("inv-size"); if (s) applySize(s);
  const l = localStorage.getItem("inv-lang");
  if (l){ lang = l; [...$("#langGroup").children].forEach(x => x.setAttribute("aria-pressed", String(x.dataset.lang === lang))); }
}catch{}

render();
</script>
</body>
</html>
